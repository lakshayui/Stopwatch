<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-700 flex items-center justify-center h-full m-0 px-6">
    <article class="bg-white flex flex-col items-center gap-6 p-10 border rounded-[10px] w-full max-w-sm">
        <h1 class="text-2xl font-bold">Counter</h1>

        <div id="countDisplay" class="text-5xl font-bold">0</div>

        <div class="flex gap-4">
            <button id="decreaseBtn" type="button" class="w-14 h-14 text-2xl font-bold border rounded bg-slate-200 hover:bg-slate-300">−</button>
            <button id="resetBtn" type="button" class="px-4 h-14 text-sm font-semibold border rounded bg-slate-100 hover:bg-slate-200">Reset</button>
            <button id="increaseBtn" type="button" class="w-14 h-14 text-2xl font-bold border rounded bg-slate-200 hover:bg-slate-300">+</button>
        </div>
    </article>

<script src="script.js"></script>
</body>
</html>
